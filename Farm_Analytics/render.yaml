services:
  - type: web
    name: farm-analytics
    env: python
    buildCommand: pip install -r App/requirements.txt
    startCommand: streamlit run App/Dashboard.py --server.port=$PORT --server.address=0.0.0.0
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        sync: false