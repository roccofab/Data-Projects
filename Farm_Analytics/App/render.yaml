services:
  - type: web
    name: farm-analytics-dashboard
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run Dashboard.py --server.port=$PORT --server.address=0.0.0.0
    rootDir: Farm_Analytics/App
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DB_HOST
        value: your_database_host
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        value: your_username
      - key: DB_PASSWORD
        value: your_password
      - key: DB_NAME
        value: your_database_name
